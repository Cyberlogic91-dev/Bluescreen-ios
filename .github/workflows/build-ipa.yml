# Compile BlueScreen sur un Mac GitHub (Xcode) et produit un .ipa non signé,
# à installer sur son iPhone avec Sideloadly ou AltStore Classic (identifiant Apple gratuit, 7 jours).
name: Compilation iOS (IPA non signé)
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "altstore/**"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: sudo xcode-select -s /Applications/Xcode.app && xcodebuild -version
      - name: Projet Xcode (XcodeGen)
        run: brew install xcodegen && xcodegen generate
      - name: Compilation
        run: |
          set -o pipefail
          xcodebuild -project BlueScreen.xcodeproj -scheme BlueScreen -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tee build.log | grep -E "error|warning: |BUILD" || true
          test -d build/Build/Products/Release-iphoneos/BlueScreen.app
      - name: Paquet IPA
        run: |
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/BlueScreen.app Payload/
          zip -qry BlueScreen-unsigned.ipa Payload
          ls -la BlueScreen-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: BlueScreen-ipa
          path: BlueScreen-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journal-compilation
          path: build.log
      - name: Publication (release GitHub + source AltStore Classic)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Payload/BlueScreen.app/Info.plist)
          BUILD=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" Payload/BlueScreen.app/Info.plist)
          TAG="v$VERSION-$BUILD"
          cp BlueScreen-unsigned.ipa BlueScreen.ipa
          gh release delete "$TAG" -y --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" BlueScreen.ipa --title "BlueScreen $VERSION ($BUILD)" \
            --notes "Appli iPhone BlueScreen, à installer avec AltStore Classic (source CYBERLOGIC) ou Sideloadly." --latest
          SIZE=$(stat -f%z BlueScreen.ipa)
          python3 scripts/update_source.py "$VERSION" "$BUILD" "$SIZE" "https://github.com/${{ github.repository }}/releases/download/$TAG/BlueScreen.ipa"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs/altstore && cp altstore/source.json docs/altstore/source.json
          git add altstore/source.json docs/altstore/source.json
          git commit -m "Source AltStore : BlueScreen $VERSION ($BUILD) [skip ci]" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
