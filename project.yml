# BlueScreen — projet iOS (généré avec XcodeGen : `brew install xcodegen && xcodegen generate`)
name: BlueScreen
options:
  bundleIdPrefix: fr.cyberlogic
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "3.8"
    CURRENT_PROJECT_VERSION: "32"
    DEVELOPMENT_TEAM: "XXXXXXXXXX"        # ← ton Team ID Apple (developer.apple.com > Membership)
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    INFOPLIST_FILE: BlueScreen/Info.plist
    GENERATE_INFOPLIST_FILE: NO
targets:
  BlueScreen:
    type: application
    platform: iOS
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.cyberlogic.bluescreen
        PRODUCT_NAME: BlueScreen
    sources:
      - path: BlueScreen
        excludes:
          - "www/**"
      - path: BlueScreen/www
        type: folder
        buildPhase: resources
